[workspace]
resolver = "3"
members = ["lib/tungsten-core", "lib/tungsten-types"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.dependencies]
tungsten-core = { path = "./lib/tungsten-core" }
tungsten-types = { path = "./lib/tungsten-types" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
